[alembic]
script_location = alembic
prepend_sys_path = services/api/src
path_separator = os
sqlalchemy.url = postgresql+psycopg://halo_migrator:halo_migrator_fixture@127.0.0.1:5432/halo_fixture

[loggers]
keys = root
level = WARN

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
